[project]
name = "rfp-analyzer"
version = "0.1.0"
description = "Federal RFP compliance-matrix generator - parsing and structure library"
readme = "README.md"
authors = [
    { name = "Ross Connacher", email = "ross@connacher.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
rfp-analyzer = "rfp_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
